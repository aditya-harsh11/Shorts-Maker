# Narration now comes from your own file (uploads/audio.mp3) and captions are
# generated by captionGen.py — there is no built-in TTS anymore. Only the keys
# below are used by the pipeline.

[reddit.thread]
subreddit = { optional = false, regex = "[_0-9a-zA-Z\\+]+$", nmin = 3, default = "stories", explanation = "Output folder/label under results/. Not an actual subreddit.", example = "stories", oob_error = "Must be 3+ characters" }
post_lang = { default = "", optional = true, explanation = "Optional language to translate the title/filename to. Empty = none.", example = "es-cr", options = ['','af', 'ak', 'am', 'ar', 'as', 'ay', 'az', 'be', 'bg', 'bho', 'bm', 'bn', 'bs', 'ca', 'ceb', 'ckb', 'co', 'cs', 'cy', 'da', 'de', 'doi', 'dv', 'ee', 'el', 'en', 'en-US', 'eo', 'es', 'et', 'eu', 'fa', 'fi', 'fr', 'fy', 'ga', 'gd', 'gl', 'gn', 'gom', 'gu', 'ha', 'haw', 'hi', 'hmn', 'hr', 'ht', 'hu', 'hy', 'id', 'ig', 'ilo', 'is', 'it', 'iw', 'ja', 'jw', 'ka', 'kk', 'km', 'kn', 'ko', 'kri', 'ku', 'ky', 'la', 'lb', 'lg', 'ln', 'lo', 'lt', 'lus', 'lv', 'mai', 'mg', 'mi', 'mk', 'ml', 'mn', 'mni-Mtei', 'mr', 'ms', 'mt', 'my', 'ne', 'nl', 'no', 'nso', 'ny', 'om', 'or', 'pa', 'pl', 'ps', 'pt', 'qu', 'ro', 'ru', 'rw', 'sa', 'sd', 'si', 'sk', 'sl', 'sm', 'sn', 'so', 'sq', 'sr', 'st', 'su', 'sv', 'sw', 'ta', 'te', 'tg', 'th', 'ti', 'tk', 'tl', 'tr', 'ts', 'tt', 'ug', 'uk', 'ur', 'uz', 'vi', 'xh', 'yi', 'yo', 'zh-CN', 'zh-TW', 'zu'] }

[settings]
resolution_w = { optional = false, default = 1080, example = 1440, explanation = "Width in pixels of the final video" }
resolution_h = { optional = false, default = 1920, example = 2560, explanation = "Height in pixels of the final video" }
channel_name = { optional = true, default = "Reddit Tales", example = "Reddit Stories", explanation = "Name drawn on the opening title card" }
show_Reddit_Title = { optional = true, option = [true, false], default = true, type = "bool", explanation = "Show the Reddit-style title card at the start of the video?" }
title_card_seconds = { optional = true, type = "float", default = 4, example = 5, nmin = 0, explanation = "How many seconds the title card stays on screen at the start.", oob_error = "Must be 0 or more" }

[settings.background]
background_video = { optional = true, default = "minecraft", example = "rocket-league", options = ["minecraft", "gta", "rocket-league", "motor-gta", "csgo-surf", "cluster-truck", "minecraft-2","multiversus","fall-guys","steep", ""], explanation = "Background gameplay footage by game name" }
background_audio = { optional = true, default = "lofi", example = "chill-summer", options = ["lofi","lofi-2","chill-summer",""], explanation = "Background music track" }
background_audio_volume = { optional = true, type = "float", nmin = 0, nmax = 1, default = 0.15, example = 0.05, explanation="Volume of the background music. Set to 0 for no music.", oob_error = "The volume HAS to be between 0 and 1", input_error = "The volume HAS to be a float number between 0 and 1"}
